name: Unpack Aceapp Histology ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: zip
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found: $ZIP_FILE"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          ZIP_FILE="${{ steps.zip.outputs.file }}"

          rm -rf _aceapp_unpack
          mkdir -p _aceapp_unpack

          unzip -q "$ZIP_FILE" -d _aceapp_unpack

          echo "ZIP extracted."

          FILE_COUNT="$(find _aceapp_unpack -mindepth 1 -maxdepth 1 -type f | wc -l)"
          DIR_COUNT="$(find _aceapp_unpack -mindepth 1 -maxdepth 1 -type d | wc -l)"

          SOURCE="_aceapp_unpack"

          if [ "$FILE_COUNT" -eq 0 ] && [ "$DIR_COUNT" -eq 1 ]; then
            SOURCE="$(find _aceapp_unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            echo "Detected wrapper folder:"
            echo "$SOURCE"
          fi

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/unpack-histology.yml' \
            "$SOURCE"/ ./

          rm -rf _aceapp_unpack
          rm -f "$ZIP_FILE"

          echo "Files copied to repository root."

      - name: Commit extracted files
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Unpack Aceapp Histology website"
          git push
